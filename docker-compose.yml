version: '3.8'

services:
  # 1. Banco de Dados (Postgres)
  db:
    build:
      context: ./database
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=antonio_fidel
      - POSTGRES_PASSWORD=antoniofidel2026
    ports:
      - "5432:5432"

  # 2. Aplicação Backend (Django)
  web:
    build:
      context: ./web_atv
    volumes:
      - ./web_atv:/app
      - arquivos_volume:/app/.arquivos  # Volume persistente para uploads
      - static_volume:/app/static      # Volume compartilhado de estáticos
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=antonio_fidel
      - POSTGRES_PASSWORD=antoniofidel2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  # 3. Servidor Web (Nginx como Proxy Reverso)
  nginx:
    build:
      context: ./nginx
    volumes:
      - arquivos_volume:/app/.arquivos  
      - static_volume:/app/static    
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro  
    ports:
      - "8888:80"
    depends_on:
      - web

volumes:
  postgres_data:
  arquivos_volume:
  static_volume:                      